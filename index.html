<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的影片筆記</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<meta name="theme-color" content="#111111"><style>
:root{--g:#111111;--lg:#e5e5e5}*{box-sizing:border-box}body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;margin:0;background:#f4f4f4;color:#111}header{background:var(--g);color:white;padding:16px;position:sticky;top:0;z-index:5}header h1{font-size:19px;margin:0;font-weight:800}.head{max-width:520px;margin:auto}.help{font-size:12px;margin:6px 0 0;line-height:1.6}main{max-width:544px;margin:auto;padding:12px}button,input,select{font-family:inherit}input,select{min-height:44px;padding:10px;font-size:15px;border:1px solid #d7dee0;border-radius:12px;background:#fff;color:#222;min-width:0}.bar{display:flex;gap:8px;margin-bottom:12px}input{flex:1;width:50%}.card,#note{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #00000014}.card{cursor:pointer}.card h3{font-size:18px;margin:0 0 6px;line-height:1.5}.card p{font-size:14px;line-height:1.7;color:#555}.tag{display:inline-block;background:var(--lg);color:#000000;border-radius:20px;padding:4px 10px;margin:0 4px 4px 0;font-size:12px;font-weight:700}.meta{color:#777;font-size:12px;line-height:1.7}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin-top:12px}a{color:var(--g)}a.back{display:inline-block;padding:10px 0;cursor:pointer;font-size:14px;font-weight:700}#note{line-height:1.8;overflow-wrap:anywhere}#note h2{font-size:21px;line-height:1.5}#note img{max-width:100%}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.action{display:flex;align-items:center;gap:8px;text-align:left;border:1.5px solid #e3e3e3;background:#fff;border-radius:14px;padding:12px;color:#222;font-size:14px;font-weight:700;cursor:pointer}.action i{font-style:normal;font-size:22px}.action span{flex:1}.action em{font-style:normal;color:#aaa}:focus-visible{outline:3px solid #111111;outline-offset:3px}footer{max-width:544px;margin:auto;text-align:center;padding:20px 16px 24px;font-size:12px;color:#777;line-height:1.7}footer .ficons{display:flex;justify-content:center;gap:10px;margin-bottom:10px}.fib{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;border:0;background:none;color:#555;font-size:12px;cursor:pointer;text-decoration:none}.fib i{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #0000000f;font-style:normal;font-size:20px}footer summary{color:var(--g);font-weight:700;cursor:pointer}footer p{margin:8px 0}footer .copy{font-size:11px;color:#999}@media(max-width:360px){.bar{flex-wrap:wrap}.bar input{width:100%;flex-basis:100%}}
details.sec{border-top:1px solid #eee;padding:2px 0}details.sec>summary{list-style:none;cursor:pointer;font-size:17px;font-weight:800;padding:12px 0;display:flex;justify-content:space-between}details.sec>summary::-webkit-details-marker{display:none}details.sec>summary::after{content:'›';color:#aaa;transition:.2s}details.sec[open]>summary::after{transform:rotate(90deg)}.mine{background:#fff8e1;border-left:4px solid #c9a227;border-radius:10px;padding:8px 12px;margin:12px 0}.mine b{font-size:13px;color:#8a6d00}.ed{width:100%;min-height:140px;font:14px/1.6 ui-monospace,monospace;border:1px solid #ccc;border-radius:10px;padding:10px;margin:6px 0}.ebtn{background:#111;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}.chk{background:#fff3f3;border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}.chk a{display:block;margin:4px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:9}
mark.px{background:none;color:#b8860b;font-weight:800}mark.tbc{background:#e53935;color:#fff;border-radius:4px;padding:0 4px;font-weight:700}.chk a{color:#c62828}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e53935;margin-right:8px;vertical-align:middle;box-shadow:0 0 6px #e53935}
</style><link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="影片筆記">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">

</head>
<body><header><div class="head"><h1>▤ 影片筆記</h1><p class="help">用搜尋框找關鍵字，或用分類篩選；點一篇筆記看內容和影片，按「← 回列表」返回。標「待確認」的數字可能聽寫有誤，請回看原片。</p></div></header><main id="app" aria-live="polite"></main><footer><div class="ficons"><a class="fib" href="#"><i>▤</i>全部筆記</a><button class="fib" onclick="window.scrollTo({top:0})"><i>↑</i>回到頂端</button><button class="fib" onclick="document.getElementById('notice').open=true;document.getElementById('notice').scrollIntoView()"><i>ⓘ</i>使用聲明</button><button class="fib" onclick="login()"><i>✎</i><span id="lg">編輯登入</span></button></div><details id="notice"><summary>使用說明與聲明</summary><p>搜尋關鍵字或選擇分類，點選筆記閱讀內容；按「回列表」返回。</p><p>本站為個人影片摘要筆記，可能有疏漏，請以原影片為準。影片與引用內容之著作權歸原創作者所有；筆記不代表原作者立場，亦不構成投資建議。</p><p>本網站公開，請勿放入私人或敏感資料。</p></details><p class="copy">影片筆記 · 個人學習整理</p></footer>
<script>const RD=()=>JSON.parse(localStorage.getItem('vn_read')||'[]');const isRead=id=>RD().includes(id);const markRead=id=>{const r=RD();if(!r.includes(id)){r.push(id);localStorage.setItem('vn_read',JSON.stringify(r))}};
function hl(root){if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())ns.push(w.currentNode);
const re=/(待確認)|(\$?\d{1,3}(?:,\d{3})+(?:\.\d+)?(?:\s?(?:美元|點|萬|億))?|\$\d+(?:\.\d+)?|\d+(?:\.\d+)?\s?(?:萬|美元|美金|點)|\d{4,}(?:\.\d+)?)/g;
ns.forEach(t=>{if(t.parentNode.closest('a,code,summary'))return;const x=t.nodeValue;if(!re.test(x))return;re.lastIndex=0;const f=document.createDocumentFragment();let i=0,m;
while(m=re.exec(x)){if(!m[1]&&/^\d{2}:\d{2}/.test(x.slice(Math.max(0,m.index-3),m.index+5)))continue;if(!m[1]&&/^(19|20)\d{2}$/.test(m[0]))continue;f.append(x.slice(i,m.index));const e=document.createElement('mark');e.className=m[1]?'tbc':'px';e.textContent=m[0];f.append(e);i=m.index+m[0].length}
f.append(x.slice(i));t.replaceWith(f)})}
function fold(){const m=document.getElementById('md');if(!m)return;const out=document.createElement('div');let cur=null;[...m.childNodes].forEach(el=>{if(el.tagName==='H2'||el.tagName==='H1'){cur=document.createElement('details');cur.className='sec';const t=el.textContent;if(/一句話|市場走向/.test(t))cur.open=true;const s=document.createElement('summary');s.textContent=t;cur.appendChild(s);out.appendChild(cur)}else if(cur)cur.appendChild(el);else out.appendChild(el)});m.replaceWith(out)}

let notes=[];const app=document.getElementById('app');
function yt(u){const m=u.match(/(?:v=|live\/|youtu\.be\/|embed\/)([\w-]{11})/);return m&&m[1]}
function list(){const tags=[...new Set(notes.flatMap(n=>n.tags))];
app.innerHTML=`<div class="actions"><button class="action" onclick="list()"><i>▤</i><span>全部筆記</span><em>›</em></button><button class="action" onclick="document.getElementById('q').focus()"><i>⌕</i><span>搜尋／分類</span><em>›</em></button></div><div class="bar"><input id="q" aria-label="搜尋筆記" placeholder="搜尋筆記…"><select id="t" aria-label="分類篩選"><option value="">全部分類</option>${tags.map(t=>`<option>${t}</option>`).join('')}</select></div><div id="l"></div>`;
const r=()=>{const q=document.getElementById('q').value.toLowerCase(),t=document.getElementById('t').value;
document.getElementById('l').innerHTML=notes.filter(n=>(!t||n.tags.includes(t))&&(n.title+n.summary+n.channel).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date)).map(n=>`<div class="card" role="link" tabindex="0" onkeydown="if(event.key==='Enter')this.click()" onclick="location.hash='${n.id}'"><h3>${isRead(n.id)?'':'<span class="dot" aria-label="未讀"></span>'}${n.title}</h3><div class="meta">${n.channel} · ${n.date}</div><p>${n.summary}</p>${n.tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div>`).join('')||'<p>沒有符合的筆記</p>'};
document.getElementById('q').oninput=r;document.getElementById('t').onchange=r;r()}
const R='luke120513-sys/video-notes',OWNER='luke120513-sys';let tok=localStorage.getItem('vn_tok')||'';let cur={};
const safe=h=>DOMPurify.sanitize(h);const md2=t=>safe(marked.parse(t));
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}
function setLg(){const e=document.getElementById('lg');if(e)e.textContent=tok?'登出編輯':'編輯登入'}
async function login(){if(tok){tok='';localStorage.removeItem('vn_tok');setLg();toast('已登出');return route()}
const t=prompt('貼上你的 GitHub 金鑰（只存在這台裝置）');if(!t)return;
const r=await fetch('https://api.github.com/user',{headers:{Authorization:'Bearer '+t.trim()}});const u=r.ok?await r.json():{};
if(u.login!==OWNER){toast('驗證失敗：只有站長可以編輯');return}tok=t.trim();localStorage.setItem('vn_tok',tok);setLg();toast('已登入編輯模式');route()}
const b64e=s=>btoa(unescape(encodeURIComponent(s))),b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function gget(path){const r=await fetch(`https://api.github.com/repos/${R}/contents/${path}?ref=main&t=${Date.now()}`,{headers:{Authorization:'Bearer '+tok}});if(r.status==404&&path.endsWith('.mine.md'))return{text:'',sha:null};if(!r.ok)throw new Error('讀取失敗 '+r.status+(r.status==404||r.status==403?'（金鑰沒有 video-notes 的讀寫權限）':''));const j=await r.json();return{text:b64d(j.content),sha:j.sha}}
async function gput(path,text,sha,msg){const r=await fetch(`https://api.github.com/repos/${R}/contents/${path}`,{method:'PUT',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({message:msg,content:b64e(text),sha:sha||undefined,branch:'main'})});if(!r.ok)throw new Error(r.status);return (await r.json()).content.sha}
async function show(id){const n=notes.find(x=>x.id==id);if(!n)return list();markRead(id);let raw=await (await fetch(n.file+'?t='+Date.now())).text();let mine='';try{const r=await fetch('notes/'+id+'.mine.md?t='+Date.now());if(r.ok)mine=await r.text()}catch(e){}
const md=raw.replace(/^---[\s\S]*?---/,'');const v=yt(n.url);cur={n,raw,mine};
app.innerHTML=`<a class="back" onclick="location.hash=''">← 回列表</a>${tok?' · <a class="back" onclick="edit()">✎ 編輯這篇</a>':''}<div id="note"><h2>${n.title}</h2><div class="meta">${n.channel} · ${n.date} · <a href="${n.url}" target="_blank" rel="noopener noreferrer">原影片</a></div>${v?`<iframe title="原始影片" src="https://www.youtube.com/embed/${v}" allowfullscreen></iframe>`:''}${mine.trim()?`<div class="mine"><b>★ 我的重點</b>${safe(marked.parse(mine.replace(/\s*(?<![\d.,])(\d{1,2})[.、]\s*(?!\d)/g,'\n$1. ').trim(),{breaks:true}))}</div>`:''}<div id="md">${md2(md)}</div></div>`;hl(document.getElementById('note'));fold()}
async function edit(){const {n}=cur;const v=yt(n.url);toast('讀取中…');let a,b;try{a=await gget(n.file);b=await gget('notes/'+n.id+'.mine.md')}catch(e){alert(e.message);return}
const ts=x=>{const m=x.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);if(!m)return 0;return m[3]?(+m[1])*3600+(+m[2])*60+(+m[3]):(+m[1])*60+(+m[2])};
const chk=a.text.split('\n').filter(l=>l.includes('待確認')).map(l=>{const t=ts(l),e=document.createElement('span');e.textContent=l.slice(0,120);return (t&&v?`<a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${v}&t=${t}s">▶ `:'<a>')+e.innerHTML+'</a>'}).join('');
app.innerHTML=`<a class="back" onclick="route()">← 取消</a><div id="note"><h2>✎ ${n.title}</h2><b>★ 我的重點</b>（所有人看得到，只有你能改）<textarea id="em" class="ed">${''}</textarea>${chk?`<div class="chk"><b>待確認（點開回看原片）</b>${chk}</div>`:''}<b>筆記內容</b><textarea id="en" class="ed" style="min-height:420px"></textarea><button class="ebtn" id="sv">儲存</button></div>`;
document.getElementById('em').value=b.text;document.getElementById('en').value=a.text;
document.getElementById('sv').onclick=async()=>{try{const m=document.getElementById('em').value,t=document.getElementById('en').value;
if(m!==b.text)await gput('notes/'+n.id+'.mine.md',m,b.sha,'Edit my highlights '+n.id);if(t!==a.text)await gput(n.file,t,a.sha,'Edit note '+n.id);
toast('已儲存，網站約 1 分鐘後更新');cur.raw=t;cur.mine=m;route()}catch(e){toast('儲存失敗：'+e.message)}}}
const route=()=>location.hash.slice(1)?show(location.hash.slice(1)):list();
fetch('notes/index.json').then(r=>r.json()).then(d=>{notes=d;route()});window.onhashchange=route;setLg();
</script></body></html>
