<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的影片筆記</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>body{font-family:system-ui,"Noto Sans TC",sans-serif;margin:0;background:#fff;color:#222}header{padding:16px 16px 0;max-width:900px;margin:auto}header h1{font-size:22px;margin:0 0 4px}.help{color:#666;font-size:14px;margin:0}main{max-width:900px;margin:auto;padding:16px}input,select{padding:10px;font-size:16px;border:1px solid #ccc;border-radius:8px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}input{flex:1}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid #eee;cursor:pointer}.tag{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:6px;padding:2px 8px;margin-right:4px;font-size:13px}.meta{color:#666;font-size:14px}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:8px}#note{background:#fff;border-radius:12px;padding:16px}a.back{cursor:pointer;color:#2563eb}</style></head>
<body><header><h1>影片筆記</h1><p class="help">用搜尋框找關鍵字，或用分類篩選；點一篇筆記看內容和影片，按「← 回列表」返回。</p></header><main id="app"></main>
<script>
let notes=[];const app=document.getElementById('app');
function yt(u){const m=u.match(/(?:v=|live\/|youtu\.be\/|embed\/)([\w-]{11})/);return m&&m[1]}
function list(){const tags=[...new Set(notes.flatMap(n=>n.tags))];
app.innerHTML=`<div class="bar"><input id="q" placeholder="搜尋筆記…"><select id="t"><option value="">全部分類</option>${tags.map(t=>`<option>${t}</option>`).join('')}</select></div><div id="l"></div>`;
const r=()=>{const q=document.getElementById('q').value.toLowerCase(),t=document.getElementById('t').value;
document.getElementById('l').innerHTML=notes.filter(n=>(!t||n.tags.includes(t))&&(n.title+n.summary+n.channel).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date)).map(n=>`<div class="card" onclick="location.hash='${n.id}'"><h3>${n.title}</h3><div class="meta">${n.channel} · ${n.date}</div><p>${n.summary}</p>${n.tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div>`).join('')||'<p>沒有符合的筆記</p>'};
q.oninput=r;t.onchange=r;r()}
async function show(id){const n=notes.find(x=>x.id==id);if(!n)return list();let md=await (await fetch(n.file)).text();md=md.replace(/^---[\s\S]*?---/,'');const v=yt(n.url);
app.innerHTML=`<a class="back" onclick="location.hash=''">← 回列表</a><div id="note"><h2>${n.title}</h2><div class="meta">${n.channel} · ${n.date} · <a href="${n.url}" target="_blank">原影片</a></div>${v?`<iframe src="https://www.youtube.com/embed/${v}" allowfullscreen></iframe>`:''}${marked.parse(md)}</div>`}
const route=()=>location.hash.slice(1)?show(location.hash.slice(1)):list();
fetch('notes/index.json').then(r=>r.json()).then(d=>{notes=d;route()});window.onhashchange=route;
</script></body></html>
